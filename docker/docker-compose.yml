name: lsts-dune

services:
  dev:
    image: dune-development
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
      args:
        DUNE_UID: "${DUNE_UID:-1000}"
        DUNE_GID: "${DUNE_GID:-1000}"
    init: true
    working_dir: /workspace/source
    environment:
      CMAKE_BUILD_PARALLEL_LEVEL: "${DUNE_BUILD_JOBS:-2}"
    volumes:
      - ../:/workspace/source
      - dune-build:/workspace/source/build
    command: bash
    stdin_open: true
    tty: true

  simulator:
    image: dune-simulator
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        DUNE_BUILD_JOBS: "${DUNE_BUILD_JOBS:-2}"
    init: true
    command:
      - -c
      - "${DUNE_CONFIG:-lauv-simulator-1}"
      - -p
      - "${DUNE_PROFILES:-Simulation}"
    ports:
      - "${DUNE_HTTP_PORT:-8080}:8080"
      - "${DUNE_IMC_PORT:-6002}:6002/udp"
    stop_grace_period: 15s
    volumes:
      - dune-logs:/opt/dune/log
      - dune-db:/opt/dune/db

volumes:
  dune-build:
  dune-logs:
  dune-db:
